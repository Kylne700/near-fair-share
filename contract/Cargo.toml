[package]
name = "fair_share"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
description = "Fair Share on NEAR: sealed ratings (commit-reveal) and a split anyone can recompute. The contract holds no funds; a Sputnik DAO pays."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.24"

[dev-dependencies]
near-sdk = { version = "5.24", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
